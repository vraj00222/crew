<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Crew — the whole workflow</title>
<style>
  html, body { margin: 0; height: 100%; background: #0b0e17; }
  body { display: grid; place-items: center; }
  svg { width: 100vw; height: 100vh; display: block; }
  text { font-family: ui-sans-serif, -apple-system, "SF Pro Display", "Segoe UI", sans-serif; }
  .mono { font-family: ui-monospace, "SF Mono", Menlo, Consolas, monospace; }
  .h1   { fill: #f2f5fb; font-size: 58px; font-weight: 800; letter-spacing: -1px; }
  .sub  { fill: #aab6cf; font-size: 19px; }
  .chip { fill: #8fa0c0; font-size: 14.5px; }
  .box    { fill: #161f33; stroke: #2c3a5c; stroke-width: 1.5; }
  .panel  { fill: #10182b; stroke: #263455; stroke-width: 1.5; }
  .phoneband { fill: #171329; stroke: #3a2f55; stroke-width: 1.5; }
  .card   { fill: #16203a; stroke-width: 1.5; }
  .bt   { fill: #f2f5fb; font-size: 20px; font-weight: 700; }
  .bs   { fill: #9db0d0; font-size: 13.5px; }
  .bm   { fill: #7ea8e8; font-size: 12.5px; }
  .al   { fill: #93a3c2; font-size: 12.5px; }
  .als  { fill: #6f7e9d; font-size: 11.5px; }
  .ph   { fill: #90a5cc; font-size: 14.5px; font-weight: 600; letter-spacing: 1.5px; }
  .php  { fill: #b9a6e8; font-size: 14.5px; font-weight: 600; letter-spacing: 1.5px; }
  .name { font-size: 19px; font-weight: 700; }
  .voice{ fill: #a6b3cf; font-size: 13px; }
  .duty { fill: #8b99b8; font-size: 12.5px; }
  .tool { fill: #7ea8e8; font-size: 12px; }
  .qt   { fill: #a595d6; font-size: 12.5px; font-style: italic; }
  .pt   { fill: #d9dcec; font-size: 14px; font-weight: 600; }
  .ps   { fill: #9b93bd; font-size: 12.5px; }
  .big  { fill: #f2eefc; font-size: 16.5px; font-weight: 700; }
  .ct   { fill: #8b99b8; font-size: 12.5px; }
  .arrow { stroke: #7c89a6; stroke-width: 2; fill: none; }
  .dashed { stroke-dasharray: 6 5; }
</style>
</head>
<body>
<svg viewBox="0 0 1920 1080" role="img" preserveAspectRatio="xMidYMid meet"
     aria-label="Crew workflow: one spoken sentence goes through VoiceOS and the MCP bridge to the orchestrator, which spawns five character agents that narrate aloud on the dock; when you walk away, a stuck agent phones you, you answer out loud, and the crew carries on.">
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <polygon points="0,0 10,5 0,10" fill="#7c89a6"/>
    </marker>
  </defs>

  <!-- ======================= header ======================= -->
  <text class="h1" x="64" y="92">Crew</text>
  <circle cx="222" cy="80" r="7" fill="#74c69d"/>
  <circle cx="244" cy="80" r="7" fill="#e8703a"/>
  <circle cx="266" cy="80" r="7" fill="#8fb0e0"/>
  <circle cx="288" cy="80" r="7" fill="#c9c243"/>
  <circle cx="310" cy="80" r="7" fill="#c39b6a"/>
  <text class="sub" x="64" y="128">An agent swarm you watch instead of read — one spoken sentence, and the crew phones you back when it needs you.</text>
  <text class="chip mono" x="1856" y="84" text-anchor="end">voice-native · 5 agents · ~45 seconds · they call you</text>
  <text class="chip mono" x="1856" y="110" text-anchor="end">zero dependencies · Node + Swift stdlib · macOS + Windows</text>

  <!-- ======================= row 1: the sentence goes in ======================= -->
  <rect class="box" x="64" y="160" width="250" height="112" rx="14"/>
  <text class="bt" x="84" y="199">You</text>
  <text class="bs" x="84" y="226">one sentence, out loud</text>
  <text class="bm mono" x="84" y="252">⌃⌥ wakes VoiceOS</text>

  <line class="arrow" x1="314" y1="216" x2="430" y2="216" marker-end="url(#arr)"/>
  <text class="al" x="372" y="204" text-anchor="middle">you speak</text>

  <rect class="box" x="430" y="160" width="220" height="112" rx="14"/>
  <text class="bt" x="450" y="199">VoiceOS</text>
  <text class="bs" x="450" y="226">the always-on ear</text>
  <text class="bm mono" x="450" y="252">wakes the crew</text>

  <line class="arrow" x1="650" y1="216" x2="790" y2="216" marker-end="url(#arr)"/>
  <text class="al mono" x="720" y="204" text-anchor="middle">run_crew_task</text>

  <rect class="box" x="790" y="160" width="290" height="112" rx="14"/>
  <text class="bt" x="810" y="199">MCP bridge</text>
  <text class="bs" x="810" y="226">voiceos-bridge/mcp-server</text>
  <text class="bm mono" x="810" y="252">tools over stdio</text>

  <line class="arrow" x1="1080" y1="200" x2="1240" y2="200" marker-end="url(#arr)"/>
  <text class="al mono" x="1158" y="188" text-anchor="middle" font-size="11.5">POST :4001/start-task</text>
  <line class="arrow dashed" x1="1240" y1="248" x2="1080" y2="248" marker-end="url(#arr)"/>
  <text class="als mono" x="1160" y="268" text-anchor="middle">GET :4001/status</text>

  <rect class="box" x="1240" y="160" width="330" height="112" rx="14"/>
  <text class="bt" x="1260" y="199">Orchestrator</text>
  <text class="bs" x="1260" y="226">orchestrator/server.js · :4001</text>
  <text class="bm mono" x="1260" y="252">spawns five claude -p agents</text>

  <!-- orchestrator -> stage -->
  <line class="arrow" x1="1300" y1="272" x2="1300" y2="348" marker-end="url(#arr)"/>
  <text class="al" x="1288" y="316" text-anchor="end">spawns the crew — one character each</text>
  <line class="arrow" x1="1480" y1="272" x2="1480" y2="348" marker-end="url(#arr)"/>
  <text class="al mono" x="1492" y="308">POST :4002/agent-status</text>
  <text class="als" x="1492" y="326">every line, spoken in character</text>

  <!-- ======================= the stage ======================= -->
  <rect class="panel" x="64" y="352" width="1496" height="418" rx="18"/>
  <text class="ph mono" x="88" y="390">THE DOCK — crew-dock/ · five characters along the bottom of your screen, narrating themselves as they work</text>

  <!-- triage -->
  <rect class="card" x="92" y="408" width="272" height="346" rx="14" stroke="#74c69d" stroke-opacity="0.45"/>
